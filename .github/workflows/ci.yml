name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Validate OpenCode Erasmus layer
        run: python scripts/validate_opencode_layer.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate task contracts (governance control plane)
        run: |
          python scripts/validate_contract.py contracts/fixtures/valid_task.json
        env:
          PYTHONPATH: src

      - name: Build Python distribution
        run: |
          python -m pip install build
          python -m build

      - name: Upload Python distribution
        uses: actions/upload-artifact@v4
        with:
          name: erasmus-python-${{ runner.os }}-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
