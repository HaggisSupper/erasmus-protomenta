name: Apply Foundry review fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/okf-knowledge-foundry' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply reviewed fixes
        run: python scripts/apply_foundry_review_fix.py

      - name: Verify focused fixes
        run: |
          python -m pip install -e . pytest
          python -m pytest tests/test_knowledge_foundry.py tests/test_knowledge_foundry_safety.py -q

      - name: Remove repair scaffolding and commit
        run: |
          rm .github/workflows/fix-foundry-review.yml
          rm scripts/apply_foundry_review_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden foundry provenance and publication"
          git push origin HEAD:${GITHUB_HEAD_REF}
